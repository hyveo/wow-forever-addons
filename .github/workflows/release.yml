# 태그 규칙: <애드온폴더명>-v<버전>   예) LevelPace-v1.0.1
# 태그를 push하면 그 애드온만 zip으로 묶어 GitHub Release에 올린다.
name: Release addon

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 자동 검사(문법, 가짜 게임 환경 시나리오)를 통과하지 못하면 배포하지 않는다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 자동 검사
        run: |
          pip install --quiet lupa
          python3 tests/run_tests.py

      - name: 태그에서 애드온 이름과 버전 추출
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "addon=${TAG%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*-v}" >> "$GITHUB_OUTPUT"

      - name: zip 만들기
        id: pkg
        run: echo "zip=$(scripts/package.sh '${{ steps.meta.outputs.addon }}' '${{ steps.meta.outputs.version }}')" >> "$GITHUB_OUTPUT"

      - name: 릴리스 노트 만들기 (CHANGELOG 해당 버전 + 예시 화면)
        run: |
          A="${{ steps.meta.outputs.addon }}"; V="${{ steps.meta.outputs.version }}"
          CL="addons/$A/CHANGELOG.md"
          # "## <버전>" 부터 다음 "## " 직전까지 추출
          awk -v v="$V" '$0 ~ "^## "v"([^0-9.]|$)" {f=1; next} f && /^## / {exit} f' "$CL" \
            | grep -v '^!\[' > notes.md || true
          IMG="addons/$A/docs/v$V-before-after.png"
          if [ -f "$IMG" ]; then
            printf '\n### 게임 화면 예시 (수정 전 → 후)\n\n![%s %s](https://github.com/%s/blob/%s/%s?raw=true)\n' \
              "$A" "$V" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$IMG" >> notes.md
          fi
          printf '\n---\nInstall: unzip and put the folder into `Interface\\AddOns\\`, then restart the game.\n\n설치: zip을 풀어 나온 폴더를 `Interface\\AddOns\\`에 넣고 게임 재시작\n' >> notes.md
          # 변경 내역은 영어 먼저, 한국어 다음으로 적는다. 빠졌으면 실행 기록에 경고를 남긴다.
          grep -q '^\*\*English\*\*' notes.md || echo "::warning::CHANGELOG $A $V 항목에 **English** 부분이 없습니다."
          grep -q '^\*\*한국어\*\*' notes.md || echo "::warning::CHANGELOG $A $V 항목에 **한국어** 부분이 없습니다."
          cat notes.md

      # GitHub에서 릴리즈를 만들 때 "Set as a pre-release"를 체크했으면 베타로 올린다.
      # 베타는 CurseForge 앱에서 "베타 받기"를 켠 사람에게만 보인다.
      - name: 베타인지 확인
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=$(gh release view "${GITHUB_REF_NAME}" --json isPrerelease -q .isPrerelease 2>/dev/null || echo false)
          if [ "$PRE" = "true" ]; then echo "type=beta" >> "$GITHUB_OUTPUT"; else echo "type=release" >> "$GITHUB_OUTPUT"; fi
          echo "배포 종류: $PRE (true=베타)"

      - name: Release 생성 또는 파일 갱신
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.pkg.outputs.zip }}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "${{ steps.pkg.outputs.zip }}" \
              --title "${{ steps.meta.outputs.addon }} ${{ steps.meta.outputs.version }}" \
              --notes-file notes.md
          fi

      # CurseForge에도 같은 zip을 올린다. 실패해도 GitHub Release는 그대로 둔다.
      # 저장소 Secrets의 CF_API_KEY(CurseForge API 토큰)가 필요하다.
      - name: CurseForge 업로드
        continue-on-error: true
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          A="${{ steps.meta.outputs.addon }}"; V="${{ steps.meta.outputs.version }}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          case "$A" in
            LevelPace)   PID=1814884 ;;
            CenterBar)   PID=1814948 ;;
            HyveoCenter) PID=1814965 ;;
            *) echo "CurseForge 프로젝트 번호를 모르는 애드온: $A"; exit 0 ;;
          esac
          if [ -z "$CF_API_KEY" ]; then echo "CF_API_KEY가 없어 건너뜀"; exit 0; fi
          # 게임 버전 번호 찾기 (WoW Forever 1.60.x)
          curl -sS -H "X-Api-Token: $CF_API_KEY" https://wow.curseforge.com/api/game/versions -o versions.json
          GV=$(jq -c '[.[] | select(.name=="1.60.1") | .id]' versions.json)
          if [ "$GV" = "[]" ] || [ -z "$GV" ]; then
            GV=$(jq -c '[.[] | select(.name|test("Forever";"i")) | .id] | .[-1:]' versions.json)
          fi
          if [ "$GV" = "[]" ] || [ -z "$GV" ]; then
            echo "CurseForge 게임 버전을 찾지 못함. 후보:"; jq -r '.[] | select(.name|test("^1\\.6|Forever";"i")) | "\(.id) \(.name)"' versions.json
            exit 1
          fi
          echo "게임 버전 ID: $GV"
          jq -n --rawfile cl notes.md --arg name "$A $V" --arg rt "${{ steps.kind.outputs.type }}" --argjson gv "$GV" \
            '{changelog:$cl, changelogType:"markdown", displayName:$name, gameVersions:$gv, releaseType:$rt}' > meta.json
          CODE=$(curl -sS -o cf.out -w '%{http_code}' -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=<meta.json" -F "file=@$ZIP" \
            "https://wow.curseforge.com/api/projects/$PID/upload-file")
          echo "HTTP $CODE"; cat cf.out; echo
          [ "$CODE" = "200" ]
