# 테스트용 빌드: main에 코드가 들어오거나 PR이 올라오면 "바뀐 애드온만" zip을 만들어
# Actions 실행 결과의 "Artifacts"에 올려 둔다. 배포(GitHub Release, CurseForge)는 하지 않는다.
# 배포는 지금처럼 태그(<애드온폴더명>-v<버전>)를 달 때만 release.yml이 한다.
name: Build addons (test zip)

on:
  push:
    branches: [main]
    paths:
      - "addons/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "addons/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 이번 PR이나 병합에서 실제로 바뀐 애드온만 고른다.
  # 묶는 스크립트나 이 워크플로가 바뀌었거나, 직접 실행한 경우에는 전부 만든다.
  changes:
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.pick.outputs.addons }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 바뀐 애드온 고르기
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          ALL='["CenterBar","LevelPace","HyveoCenter"]'
          if [ "$EVENT" = "pull_request" ]; then
            FILES=$(git diff --name-only "$PR_BASE...$PR_HEAD" || echo __ALL__)
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            FILES=$(git diff --name-only "$BEFORE" "$AFTER" || echo __ALL__)
          else
            FILES=__ALL__
          fi
          echo "바뀐 파일:"; echo "$FILES"
          if echo "$FILES" | grep -qE '^(__ALL__|scripts/|\.github/workflows/build\.yml)'; then
            LIST="$ALL"
          else
            LIST=$(echo "$FILES" | sed -nE 's#^addons/([^/]+)/.*#\1#p' | sort -u \
              | while read -r a; do [ -d "addons/$a" ] && echo "$a"; done \
              | jq -R . | jq -sc .)
          fi
          echo "만들 애드온: $LIST"
          echo "addons=$LIST" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: ${{ needs.changes.outputs.addons != '[]' && needs.changes.outputs.addons != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.changes.outputs.addons) }}
    steps:
      - uses: actions/checkout@v4

      # 버전 = CHANGELOG 맨 위 버전 + -dev-커밋 7자리 (예: 1.4.0-dev-a1b2c3d)
      - name: 테스트 버전 이름 정하기
        id: meta
        run: |
          A="${{ matrix.addon }}"
          V=$(grep -m1 -oE '^## [0-9]+(\.[0-9]+)*' "addons/$A/CHANGELOG.md" | cut -d' ' -f2 || true)
          SHA=$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)
          echo "version=${V:-0.0.0}-dev-$SHA" >> "$GITHUB_OUTPUT"

      # 릴리즈와 같은 스크립트로 묶은 뒤, Artifact가 zip 안의 zip이 되지 않게 풀어서 올린다
      - name: zip 만들기
        run: |
          ZIP=$(scripts/package.sh '${{ matrix.addon }}' '${{ steps.meta.outputs.version }}')
          mkdir -p out && unzip -q "$ZIP" -d out

      # Artifact 이름이 곧 내려받는 zip 이름이 된다. 풀면 게임 폴더(예: CenterBar/)가 바로 나온다.
      - name: Artifact로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.addon }}-${{ steps.meta.outputs.version }}
          path: out/
          retention-days: 30
